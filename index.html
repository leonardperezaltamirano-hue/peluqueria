<style>
  :root{
    --primary:#9333ea; --primary-dark:#7e22ce; --bg:#f6f3fb;
  }
  *{-webkit-tap-highlight-color:transparent}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg)}
  .grad{background:linear-gradient(135deg,#9333ea 0%,#c026d3 100%)}
  .card{background:#fff;border-radius:1.25rem;box-shadow:0 2px 14px rgba(124,58,237,.08)}
  .btn-primary{background:var(--primary);color:#fff;border-radius:.9rem;font-weight:600;transition:.15s}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-primary:active{transform:scale(.97)}
  .input{width:100%;border:1.5px solid #e9e3f5;border-radius:.9rem;padding:.65rem .9rem;font-size:.95rem;outline:none;transition:.15s}
  .input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(147,51,234,.12)}
  .tab-btn{padding:.5rem 1rem;border-radius:.8rem;font-size:.9rem;font-weight:600;color:#6b7280;white-space:nowrap}
  .tab-btn.active{background:var(--primary);color:#fff}
  table{border-collapse:collapse}

    .responsive-table thead{display:none}
    .responsive-table tr{display:block;background:#fff;border-radius:1rem;margin-bottom:.6rem;box-shadow:0 1px 6px rgba(0,0,0,.05);padding:.25rem}
    .responsive-table td{display:flex;justify-content:space-between;align-items:center;padding:.5rem .8rem;border:none !important;font-size:.9rem}
    .responsive-table td::before{content:attr(data-label);font-weight:600;color:#9333ea;font-size:.75rem;margin-right:.5rem}
  }
  ::-webkit-scrollbar{height:6px;width:6px}
  ::-webkit-scrollbar-thumb{background:#d8b4fe;border-radius:10px}
</style>

const mobileNav = document.getElementById('mobileNav');
const fmt = n => 'Bs. ' + Number(n || 0).toFixed(2);

function logoHeader(sub){
  return `
    <div class="grad rounded-b-3xl md:rounded-3xl text-white px-5 py-7 md:py-6 mb-5 shadow-lg">
      <h1 class="text-2xl font-extrabold flex items-center gap-2">💇‍♀️ Peluquería</h1>

    </div>`;

// ----------------------------------------------------------------
// RENDER: LOGIN / REGISTRO
// ----------------------------------------------------------------
function renderAuth(mode = 'login') {
  mobileNav.classList.add('hidden');
  app.innerHTML = `
    <div class="min-h-screen flex items-center justify-center">
      <div class="w-full max-w-sm">
        <div class="text-center mb-6">
          <div class="text-5xl mb-2">💇‍♀️</div>
          <h1 class="text-2xl font-extrabold text-purple-700">Peluquería</h1>
          <p class="text-gray-400 text-sm">Control de ingresos y servicios</p>
        </div>
        <div class="card p-6">
          <div id="authMsg" class="text-sm mb-3"></div>
          ${mode === 'login' ? `
            <form id="loginForm" class="space-y-3">
              <input required type="email" id="email" placeholder="Correo electrónico" class="input">
              <input required type="password" id="password" placeholder="Contraseña" class="input">
              <button class="w-full btn-primary py-3">Iniciar sesión</button>
            </form>
            <p class="text-center text-sm mt-5 text-gray-400">¿No tienes cuenta?
              <a href="#" id="goRegister" class="text-purple-600 font-semibold">Crear cuenta</a></p>
          ` : `
            <form id="registerForm" class="space-y-3">
              <input required type="text" id="fullName" placeholder="Nombre completo" class="input">
              <input required type="email" id="email" placeholder="Correo electrónico" class="input">
              <input required type="password" id="password" placeholder="Contraseña (mín. 6 caracteres)" class="input">
              <button class="w-full btn-primary py-3">Crear cuenta</button>
            </form>
            <p class="text-center text-sm mt-5 text-gray-400">¿Ya tienes cuenta?
              <a href="#" id="goLogin" class="text-purple-600 font-semibold">Inicia sesión</a></p>
          `}
        </div>
      </div>
    </div>
  `;

  const msg = (text, ok=false) => {
    document.getElementById('authMsg').innerHTML =
      `<div class="rounded-lg px-3 py-2 ${ok ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-600'}">${text}</div>`;
  };

  if (mode === 'login') {
    document.getElementById('goRegister').onclick = (e) => { e.preventDefault(); renderAuth('register'); };
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) return msg(error.message);
      await loadSession();
    };
  } else {
    document.getElementById('goLogin').onclick = (e) => { e.preventDefault(); renderAuth('login'); };
    document.getElementById('registerForm').onsubmit = async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await sb.auth.signUp({ email, password, options: { data: { full_name } } });
      if (error) return msg(error.message);
      msg('Cuenta creada. Un administrador debe aprobar tu acceso.', true);
    };
  }
}

function renderPending() {
  mobileNav.classList.add('hidden');
  app.innerHTML = `
    <div class="min-h-screen flex items-center justify-center text-center px-4">
      <div class="card p-8 max-w-sm">
        <div class="text-4xl mb-2">⏳</div>
        <h2 class="text-lg font-bold text-gray-700 mb-2">Cuenta pendiente</h2>
        <p class="text-gray-400 mb-5 text-sm">Tu cuenta aún no fue aprobada ni asignada a un rol por el administrador.</p>
        <button id="logout" class="btn-primary px-5 py-2">Cerrar sesión</button>
      </div>
    </div>`;
  document.getElementById('logout').onclick = async () => { await sb.auth.signOut(); renderAuth(); };
}

// ----------------------------------------------------------------
// LAYOUT PRINCIPAL
// ----------------------------------------------------------------
function tabsFor(isAdmin){
  return isAdmin
    ? [['usuarios','👥','Usuarios'],['servicios','✂️','Servicios'],['ingresos','💰','Ingresos']]
    : [['registrar','➕','Registrar'],['mishistorial','📋','Historial']];
}

function layout(activeTab) {
  const isAdmin = currentProfile.role === 'admin';
  const tabs = tabsFor(isAdmin);

  app.innerHTML = `
    ${logoHeader(`${currentProfile.full_name} · <span class="capitalize">${currentProfile.role}</span>`)}
    <div class="flex items-center justify-between mb-4">
      <div class="hidden md:flex gap-2">
        ${tabs.map(([key,icon,label]) => `<button data-tab="${key}" class="tab-btn ${key===activeTab?'active':''}">${icon} ${label}</button>`).join('')}
      </div>
      <div></div>
      <button id="logoutBtn" class="text-sm text-gray-400 hover:text-red-500 font-medium">Cerrar sesión ↩</button>
    </div>
    <div id="content"></div>
  `;

  mobileNav.classList.remove('hidden');
  mobileNav.innerHTML = tabs.map(([key,icon,label]) => `
    <button data-tab="${key}" class="flex flex-col items-center text-xs font-medium px-3 py-1 rounded-xl ${key===activeTab?'text-purple-600':'text-gray-400'}">
      <span class="text-xl">${icon}</span>${label}
    </button>`).join('');

  document.getElementById('logoutBtn').onclick = async () => { await sb.auth.signOut(); renderAuth(); };

  const go = (tab) => {
    if (tab === 'usuarios') renderUsuarios();
    if (tab === 'servicios') renderServicios();
    if (tab === 'ingresos') renderIngresosAdmin();
    if (tab === 'registrar') renderRegistrarIngreso();
    if (tab === 'mishistorial') renderMiHistorial();
  };
  document.querySelectorAll('[data-tab]').forEach(btn => btn.onclick = () => go(btn.dataset.tab));
}

// ----------------------------------------------------------------
// ADMIN: USUARIOS
// ----------------------------------------------------------------
async function renderUsuarios() {
  layout('usuarios');
  const { data: users, error } = await sb.from('profiles').select('*').order('created_at');
  const content = document.getElementById('content');
  if (error) return content.innerHTML = `<p class="text-red-600">${error.message}</p>`;

  const rows = users.map(u => `
    <tr class="border-b border-purple-50">
      <td data-label="Nombre" class="py-2 px-3 font-medium">${u.full_name}</td>
      <td data-label="Rol" class="py-2 px-3"><input data-id="${u.id}" class="roleInput input" style="padding:.4rem .6rem" value="${u.role}"></td>
      <td data-label="Activo" class="py-2 px-3"><input type="checkbox" data-id="${u.id}" class="activeCheck w-5 h-5 accent-purple-600" ${u.active ? 'checked' : ''}></td>
      <td data-label="" class="py-2 px-3"><button data-id="${u.id}" class="saveUser text-purple-600 text-sm font-semibold">Guardar ✓</button></td>
    </tr>`).join('');

  content.innerHTML = `
    <div class="card p-4 mb-4 text-sm text-gray-500">
      💡 Asigna un rol (ej. <b>peluquero</b>, <b>manicurista</b>, <b>admin</b>) y activa la casilla para dar acceso. Los usuarios se registran ellos mismos desde "Crear cuenta".
    </div>
    <div class="card overflow-x-auto">
      <table class="w-full text-sm responsive-table">
        <thead class="bg-purple-50 text-purple-700 text-left">
          <tr><th class="py-3 px-3">Nombre</th><th class="py-3 px-3">Rol</th><th class="py-3 px-3">Activo</th><th class="py-3 px-3"></th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  document.querySelectorAll('.saveUser').forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.id;
    const role = document.querySelector(`.roleInput[data-id="${id}"]`).value.trim();
    const active = document.querySelector(`.activeCheck[data-id="${id}"]`).checked;
    const { error } = await sb.from('profiles').update({ role, active }).eq('id', id);
    btn.textContent = error ? 'Error ✗' : 'Guardado ✓';
    setTimeout(() => btn.textContent = 'Guardar ✓', 1500);
  });
}

// ----------------------------------------------------------------
// ADMIN: SERVICIOS
// ----------------------------------------------------------------
async function renderServicios() {
  layout('servicios');
  const { data: services, error } = await sb.from('services').select('*').order('created_at');
  const content = document.getElementById('content');
  if (error) return;

  const rows = (services||[]).map(s => `
    <tr class="border-b border-purple-50">
      <td data-label="Servicio" class="py-2 px-3 font-medium">${s.name}</td>
      <td data-label="Precio" class="py-2 px-3 text-purple-700 font-semibold">${fmt(s.price)}</td>
      <td data-label="Activo" class="py-2 px-3"><input type="checkbox" data-id="${s.id}" class="svcActive w-5 h-5 accent-purple-600" ${s.active ? 'checked' : ''}></td>
      <td data-label="" class="py-2 px-3"><button data-id="${s.id}" class="delSvc text-red-500 text-sm font-semibold">Eliminar</button></td>
    </tr>`).join('');

  content.innerHTML = `
    <div class="card p-5 mb-4">
      <h3 class="font-bold mb-3 text-purple-700">✂️ Nuevo servicio</h3>
      <form id="newServiceForm" class="flex flex-col sm:flex-row gap-2">
        <input required id="svcName" placeholder="Nombre del servicio" class="input sm:flex-1">
        <input required type="number" step="0.01" id="svcPrice" placeholder="Precio (Bs.)" class="input sm:w-36">
        <button class="btn-primary px-5 py-2.5 whitespace-nowrap">Agregar</button>
      </form>
    </div>
    <div class="card overflow-x-auto">
      <table class="w-full text-sm responsive-table">
        <thead class="bg-purple-50 text-purple-700 text-left">
          <tr><th class="py-3 px-3">Servicio</th><th class="py-3 px-3">Precio</th><th class="py-3 px-3">Activo</th><th class="py-3 px-3"></th></tr>
        </thead>
        <tbody>${rows || '<tr><td class="py-4 px-3 text-gray-400" colspan="4">Sin servicios aún</td></tr>'}</tbody>
      </table>
    </div>`;

  document.getElementById('newServiceForm').onsubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById('svcName').value;
    const price = parseFloat(document.getElementById('svcPrice').value);
    const { error } = await sb.from('services').insert({ name, price });
    if (!error) renderServicios();
  };
  document.querySelectorAll('.svcActive').forEach(chk => chk.onchange = async () => {
    await sb.from('services').update({ active: chk.checked }).eq('id', chk.dataset.id);
  });
  document.querySelectorAll('.delSvc').forEach(btn => btn.onclick = async () => {
    if (!confirm('¿Eliminar este servicio?')) return;
    const { error } = await sb.from('services').delete().eq('id', btn.dataset.id);
    if (error) alert('No se puede eliminar: tiene ingresos registrados. Desactívalo en su lugar.');
    else renderServicios();
  });
}

// ----------------------------------------------------------------
// ADMIN: INGRESOS
// ----------------------------------------------------------------
async function renderIngresosAdmin() {
  layout('ingresos');
  const { data: employees } = await sb.from('profiles').select('id, full_name').neq('role', 'pendiente');
  const empOptions = (employees || []).map(e => `<option value="${e.id}">${e.full_name}</option>`).join('');
  const content = document.getElementById('content');

  content.innerHTML = `
    <div class="card p-4 mb-4">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 items-end">
        <div class="col-span-2 sm:col-span-1">
          <label class="text-xs text-gray-400 block mb-1">Empleado</label>
          <select id="filtroEmpleado" class="input"><option value="">Todos</option>${empOptions}</select>
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">Desde</label>
          <input type="date" id="filtroDesde" class="input">
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">Hasta</label>
          <input type="date" id="filtroHasta" class="input">
        </div>
        <button id="filtrarBtn" class="btn-primary py-2.5">Filtrar</button>
      </div>
    </div>
    <div id="resumenTotales" class="mb-4"></div>
    <div id="tablaIngresos" class="card overflow-x-auto"></div>
  `;

  async function cargar() {
    let query = sb.from('income_records')
      .select('id, amount, client_name, payment_method, record_date, profiles(full_name), services(name)')
      .order('record_date', { ascending: false });
    const emp = document.getElementById('filtroEmpleado').value;
    const desde = document.getElementById('filtroDesde').value;
    const hasta = document.getElementById('filtroHasta').value;
    if (emp) query = query.eq('employee_id', emp);
    if (desde) query = query.gte('record_date', desde);
    if (hasta) query = query.lte('record_date', hasta);

    const { data, error } = await query;
    if (error) { document.getElementById('tablaIngresos').innerHTML = `<p class="text-red-600 p-3">${error.message}</p>`; return; }

    const total = (data || []).reduce((s, r) => s + Number(r.amount), 0);
    const porEmpleado = {};
    (data || []).forEach(r => {
      const nombre = r.profiles?.full_name || '—';
      porEmpleado[nombre] = (porEmpleado[nombre] || 0) + Number(r.amount);
    });

    document.getElementById('resumenTotales').innerHTML = `
      <div class="grid grid-cols-2 sm:flex sm:flex-wrap gap-3">
        <div class="card px-4 py-3 bg-purple-600 text-white">
          <p class="text-xs text-purple-100">Total general</p><p class="text-xl font-extrabold">${fmt(total)}</p>
        </div>
        ${Object.entries(porEmpleado).map(([n,t]) => `
          <div class="card px-4 py-3"><p class="text-xs text-gray-400">${n}</p><p class="font-bold text-purple-700">${fmt(t)}</p></div>
        `).join('')}
      </div>`;

    const rows = (data || []).map(r => `
      <tr class="border-b border-purple-50">
        <td data-label="Fecha" class="py-2 px-3">${r.record_date}</td>
        <td data-label="Empleado" class="py-2 px-3">${r.profiles?.full_name || '—'}</td>
        <td data-label="Servicio" class="py-2 px-3">${r.services?.name || '—'}</td>
        <td data-label="Cliente" class="py-2 px-3">${r.client_name || '—'}</td>
        <td data-label="Monto" class="py-2 px-3 font-semibold text-purple-700">${fmt(r.amount)}</td>
      </tr>`).join('');

    document.getElementById('tablaIngresos').innerHTML = `
      <table class="w-full text-sm responsive-table">
        <thead class="bg-purple-50 text-purple-700 text-left">
          <tr><th class="py-3 px-3">Fecha</th><th class="py-3 px-3">Empleado</th><th class="py-3 px-3">Servicio</th><th class="py-3 px-3">Cliente</th><th class="py-3 px-3">Monto</th></tr>
        </thead>
        <tbody>${rows || '<tr><td class="py-4 px-3 text-gray-400" colspan="5">Sin registros</td></tr>'}</tbody>
      </table>`;
  }

  document.getElementById('filtrarBtn').onclick = cargar;
  cargar();
}

// ----------------------------------------------------------------
// EMPLEADO: REGISTRAR INGRESO
// ----------------------------------------------------------------
async function renderRegistrarIngreso() {
  layout('registrar');
  const { data: services } = await sb.from('services').select('*').eq('active', true).order('name');
  const options = (services || []).map(s => `<option value="${s.id}" data-price="${s.price}">${s.name} — ${fmt(s.price)}</option>`).join('');
  const content = document.getElementById('content');

  content.innerHTML = `
    <div class="card p-5 max-w-md mx-auto md:mx-0">
      <h3 class="font-bold mb-3 text-purple-700">➕ Registrar nuevo ingreso</h3>
      <form id="ingresoForm" class="space-y-3">
        <select required id="servicioSel" class="input">
          <option value="">Selecciona un servicio</option>${options}
        </select>
        <input required type="number" step="0.01" id="montoInput" placeholder="Monto (Bs.)" class="input">
        <input id="clienteInput" placeholder="Nombre del cliente (opcional)" class="input">
        <select id="pagoInput" class="input">
          <option value="efectivo">💵 Efectivo</option>
          <option value="tarjeta">💳 Tarjeta</option>
          <option value="qr">📱 QR / Transferencia</option>
        </select>
        <input type="date" id="fechaInput" class="input" value="${new Date().toISOString().slice(0,10)}">
        <button class="w-full btn-primary py-3">Guardar ingreso</button>
      </form>
      <p id="okMsg" class="text-green-600 text-sm mt-2 text-center font-medium"></p>
    </div>`;

  document.getElementById('servicioSel').onchange = (e) => {
    const price = e.target.selectedOptions[0]?.dataset.price;
    if (price) document.getElementById('montoInput').value = price;
  };

  document.getElementById('ingresoForm').onsubmit = async (e) => {
    e.preventDefault();
    const payload = {
      employee_id: currentProfile.id,
      service_id: document.getElementById('servicioSel').value,
      amount: parseFloat(document.getElementById('montoInput').value),
      client_name: document.getElementById('clienteInput').value || null,
      payment_method: document.getElementById('pagoInput').value,
      record_date: document.getElementById('fechaInput').value
    };
    const { error } = await sb.from('income_records').insert(payload);
    if (error) return alert(error.message);
    document.getElementById('ingresoForm').reset();
    document.getElementById('fechaInput').value = new Date().toISOString().slice(0,10);
    document.getElementById('okMsg').textContent = 'Ingreso registrado ✓';
    setTimeout(() => document.getElementById('okMsg').textContent = '', 2000);
  };
}

// ----------------------------------------------------------------
// EMPLEADO: MI HISTORIAL
// ----------------------------------------------------------------
async function renderMiHistorial() {
  layout('mishistorial');
  const { data, error } = await sb.from('income_records')
    .select('id, amount, client_name, payment_method, record_date, services(name)')
    .eq('employee_id', currentProfile.id)
    .order('record_date', { ascending: false });
  const content = document.getElementById('content');
  if (error) { content.innerHTML = `<p class="text-red-600">${error.message}</p>`; return; }

  const total = (data || []).reduce((s, r) => s + Number(r.amount), 0);
  const rows = (data || []).map(r => `
    <tr class="border-b border-purple-50">
      <td data-label="Fecha" class="py-2 px-3">${r.record_date}</td>
      <td data-label="Servicio" class="py-2 px-3">${r.services?.name || '—'}</td>
      <td data-label="Cliente" class="py-2 px-3">${r.client_name || '—'}</td>
      <td data-label="Pago" class="py-2 px-3 capitalize">${r.payment_method || '—'}</td>
      <td data-label="Monto" class="py-2 px-3 font-semibold text-purple-700">${fmt(r.amount)}</td>
    </tr>`).join('');

  content.innerHTML = `
    <div class="card px-5 py-4 mb-4 inline-block bg-purple-600 text-white">
      <p class="text-xs text-purple-100">Mi total acumulado</p><p class="text-xl font-extrabold">${fmt(total)}</p>
    </div>
    <div class="card overflow-x-auto">
      <table class="w-full text-sm responsive-table">
        <thead class="bg-purple-50 text-purple-700 text-left">
          <tr><th class="py-3 px-3">Fecha</th><th class="py-3 px-3">Servicio</th><th class="py-3 px-3">Cliente</th><th class="py-3 px-3">Pago</th><th class="py-3 px-3">Monto</th></tr>
        </thead>
        <tbody>${rows || '<tr><td class="py-4 px-3 text-gray-400" colspan="5">Aún no tienes registros</td></tr>'}</tbody>
      </table>
    </div>`;
}

// ----------------------------------------------------------------
// SESIÓN
// ----------------------------------------------------------------
async function loadSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderAuth();
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (error || !profile) return renderPending();
  currentProfile = profile;
  if (profile.role === 'pendiente' || !profile.active) return renderPending();
  if (profile.role === 'admin') renderUsuarios();
  else renderRegistrarIngreso();
}

sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') renderAuth(); });
loadSession();
</script>
