// ----------------------------------------------------------------
// MODAL SYSTEM (REPLACES ALERT/CONFIRM)
// ----------------------------------------------------------------
function openModal(html) {
  modalContainer.innerHTML = html;
  modalOverlay.classList.remove('opacity-0', 'pointer-events-none');
  modalContainer.classList.remove('scale-95');
  modalContainer.classList.add('scale-100');
}

function closeModal() {
  modalOverlay.classList.add('opacity-0', 'pointer-events-none');
  modalContainer.classList.remove('scale-100');
  modalContainer.classList.add('scale-95');
}

modalOverlay.onclick = (e) => {
  if (e.target === modalOverlay) closeModal();
};

function showConfirm(title, message, onConfirm) {
  openModal(`
    <div class="text-center">
      <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">⚠️</div>
      <h3 class="text-lg font-bold text-slate-800 mb-2">${title}</h3>
      <p class="text-slate-500 text-sm mb-6">${message}</p>
      <div class="flex gap-3 justify-center">
        <button id="cancelModalBtn" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-semibold text-sm hover:bg-slate-50 transition">Cancelar</button>
        <button id="confirmModalBtn" class="px-5 py-2.5 rounded-xl bg-red-600 text-white font-semibold text-sm hover:bg-red-700 transition shadow-lg shadow-red-600/20">Sí, continuar</button>
      </div>
    </div>
  `);
  document.getElementById('cancelModalBtn').onclick = closeModal;
  document.getElementById('confirmModalBtn').onclick = async () => {
    closeModal();
    await onConfirm();
  };
}

function tabsFor(isAdmin) {
  return isAdmin
    ? [['usuarios','👥','Usuarios'],['servicios','✂️','Servicios'],['ingresos','💰','Ingresos']]
    : [['registrar','➕','Registrar'],['mishistorial','📋','Historial']];
}

  const isAdmin = currentProfile.role === 'admin';
  const tabs = tabsFor(isAdmin);

  app.innerHTML = `
    ${logoHeader(`
      <div class="flex items-center gap-2 mt-1">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>

        <span class="bg-white/20 text-white text-xs px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider border border-white/20">${currentProfile.role}</span>

    `)}
    <div class="flex items-center justify-between gap-4 mb-6">
      <div class="hidden md:flex gap-1.5 bg-white/70 backdrop-blur-md p-1.5 rounded-2xl border border-purple-100 shadow-sm">
        ${tabs.map(([key,icon,label]) => `
          <button data-tab="${key}" class="px-5 py-2.5 rounded-xl font-bold text-sm transition-all duration-200 flex items-center gap-2 ${key===activeTab ? 'bg-gradient-to-r from-purple-600 to-purple-700 text-white shadow-md shadow-purple-600/20' : 'text-slate-600 hover:text-purple-700 hover:bg-purple-50/50'}">
            <span>${icon}</span> ${label}
          </button>
        `).join('')}
      </div>
      <div></div>
      <button id="logoutBtn" class="flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-rose-600 bg-white hover:bg-rose-50 border border-slate-200 hover:border-rose-200 px-3.5 py-2 rounded-xl transition shadow-sm">
        <span>Cerrar sesión</span>
        <span>↩</span>
      </button>
    </div>
    <div id="content"></div>
  `;

  mobileNav.classList.remove('hidden');
  mobileNav.innerHTML = tabs.map(([key,icon,label]) => `
    <button data-tab="${key}" class="flex flex-col items-center justify-center text-[11px] font-bold px-3 py-1 rounded-xl transition-all ${key===activeTab ? 'text-purple-600 scale-105' : 'text-slate-400 hover:text-slate-600'}">
      <span class="text-xl mb-0.5">${icon}</span>${label}
    </button>`).join('');

  document.getElementById('logoutBtn').onclick = async () => { await sb.auth.signOut(); renderAuth(); };

  const go = (tab) => {
    if (tab === 'usuarios') renderUsuarios();
    if (tab === 'servicios') renderServicios();
    if (tab === 'ingresos') renderIngresosAdmin();
    if (tab === 'registrar') renderRegistrarIngreso();
    if (tab === 'mishistorial') renderMiHistorial();
  };
  document.querySelectorAll('[data-tab]').forEach(btn => btn.onclick = () => go(btn.dataset.tab));
}

// Helper: Payment Method Badge
function getPaymentBadge(method) {
  const m = (method || '').toLowerCase();
  if (m.includes('efectivo')) return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">💵 Efectivo</span>`;
  if (m.includes('tarjeta')) return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200">💳 Tarjeta</span>`;
  if (m.includes('qr') || m.includes('transferencia')) return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-purple-50 text-purple-700 border border-purple-200">📱 QR / Transf.</span>`;
  return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 capitalize">${method || '—'}</span>`;
}

// ----------------------------------------------------------------
// MODAL: EDITAR INGRESO (ADMIN & EMPLEADO)
// ----------------------------------------------------------------
async function openEditIncomeModal(incomeId, onSaved) {
  const { data: record, error } = await sb.from('income_records').select('*').eq('id', incomeId).single();
  if (error || !record) return;

  const { data: services } = await sb.from('services').select('*').eq('active', true).order('name');
  const serviceOptions = (services || []).map(s => 
    `<option value="${s.id}" ${s.id === record.service_id ? 'selected' : ''}>${s.name} — ${fmt(s.price)}</option>`
  ).join('');

  openModal(`
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">✏️ Editar Ingreso</h3>
      <button id="closeModalCross" class="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
    </div>
    <form id="editIncomeForm" class="space-y-3.5 text-left">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Servicio</label>
        <select required id="editServicio" class="input-styled w-full rounded-xl px-3.5 py-2.5 text-sm">${serviceOptions}</select>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Monto (Bs.)</label>
        <input required type="number" step="0.01" id="editMonto" value="${record.amount}" class="input-styled w-full rounded-xl px-3.5 py-2.5 text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Cliente</label>
        <input id="editCliente" value="${record.client_name || ''}" placeholder="Nombre del cliente" class="input-styled w-full rounded-xl px-3.5 py-2.5 text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Método de pago</label>
        <select id="editPago" class="input-styled w-full rounded-xl px-3.5 py-2.5 text-sm">
          <option value="efectivo" ${record.payment_method === 'efectivo' ? 'selected' : ''}>💵 Efectivo</option>
          <option value="tarjeta" ${record.payment_method === 'tarjeta' ? 'selected' : ''}>💳 Tarjeta</option>
          <option value="qr" ${record.payment_method === 'qr' ? 'selected' : ''}>📱 QR / Transferencia</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Fecha</label>
        <input type="date" id="editFecha" value="${record.record_date}" class="input-styled w-full rounded-xl px-3.5 py-2.5 text-sm">
      </div>
      <div class="flex gap-2 justify-end mt-5 pt-2 border-t border-slate-100">
        <button type="button" id="cancelEditBtn" class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-xs font-bold hover:bg-slate-50">Cancelar</button>
        <button type="submit" class="btn-gradient px-5 py-2.5 rounded-xl text-white text-xs font-bold shadow-md shadow-purple-600/20">Guardar Cambios</button>
      </div>
    </form>
  `);

  document.getElementById('closeModalCross').onclick = closeModal;
  document.getElementById('cancelEditBtn').onclick = closeModal;
  document.getElementById('editIncomeForm').onsubmit = async (e) => {
    e.preventDefault();
    const updated = {
      service_id: document.getElementById('editServicio').value,
      amount: parseFloat(document.getElementById('editMonto').value),
      client_name: document.getElementById('editCliente').value || null,
      payment_method: document.getElementById('editPago').value,
      record_date: document.getElementById('editFecha').value
    };
    const { error: updateErr } = await sb.from('income_records').update(updated).eq('id', incomeId);
    if (!updateErr) {
      closeModal();
      if (onSaved) onSaved();
    }
  };
}

        <button data-id="${u.id}" class="saveUser bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 rounded-lg text-xs font-bold px-3 py-1.5 transition">Guardar ✓</button>
      </td>
    </tr>`).join('');

  content.innerHTML = `
    <div class="glass-card rounded-2xl p-4 mb-5 text-sm text-purple-900/80 flex items-start gap-3 border border-purple-100">
      <span class="text-xl">💡</span>
      <p class="leading-relaxed">Asigna un rol (ej. <b>peluquero</b>, <b>manicurista</b>, <b>admin</b>) y activa el interruptor para autorizar el acceso a la plataforma.</p>
    </div>
    <div class="glass-card rounded-3xl shadow-xl shadow-purple-900/5 overflow-hidden border border-purple-100">
      <div class="overflow-x-auto">
        <table class="w-full text-sm responsive-table">
          <thead class="bg-gradient-to-r from-purple-50 to-indigo-50/50 text-purple-900 text-left font-bold uppercase text-xs tracking-wider border-b border-purple-100">
            <tr>
              <th class="py-3.5 px-4">Nombre</th>
              <th class="py-3.5 px-4">Rol</th>
              <th class="py-3.5 px-4">Activo</th>
              <th class="py-3.5 px-4 text-right">Acción</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-purple-100/50">${rows}</tbody>
        </table>
      </div>
    </div>`;

  document.querySelectorAll('.saveUser').forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.id;
    const role = document.querySelector(`.roleInput[data-id="${id}"]`).value.trim();
    const active = document.querySelector(`.activeCheck[data-id="${id}"]`).checked;
    const { error } = await sb.from('profiles').update({ role, active }).eq('id', id);
    btn.textContent = error ? 'Error ✗' : '¡Guardado!';
    btn.className = error 
      ? 'bg-rose-50 text-rose-700 border border-rose-200 rounded-lg text-xs font-bold px-3 py-1.5 transition'
      : 'bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg text-xs font-bold px-3 py-1.5 transition';
    setTimeout(() => {
      btn.textContent = 'Guardar ✓';
      btn.className = 'bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 rounded-lg text-xs font-bold px-3 py-1.5 transition';
    }, 1500);
  });
}

async function renderIngresosAdmin() {
  layout('ingresos');
  const { data: employees } = await sb.from('profiles').select('id, full_name').neq('role', 'pendiente');
  const empOptions = (employees || []).map(e => `<option value="${e.id}">${e.full_name}</option>`).join('');
  const content = document.getElementById('content');

  content.innerHTML = `
    <div class="glass-card rounded-3xl p-5 mb-6 shadow-xl shadow-purple-900/5">
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 items-end">
        <div class="sm:col-span-1">
          <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-1">Empleado</label>
          <select id="filtroEmpleado" class="input-styled w-full rounded-xl px-3.5 py-2 text-sm"><option value="">Todos los empleados</option>${empOptions}</select>
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-1">Desde</label>
          <input type="date" id="filtroDesde" class="input-styled w-full rounded-xl px-3.5 py-2 text-sm">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block mb-1">Hasta</label>
          <input type="date" id="filtroHasta" class="input-styled w-full rounded-xl px-3.5 py-2 text-sm">
        </div>
        <button id="filtrarBtn" class="btn-gradient text-white font-bold py-2.5 px-4 rounded-xl text-sm shadow-md shadow-purple-600/20">
          Filtrar Resultados
        </button>
      </div>
    </div>
    
    <div id="resumenTotales" class="mb-6"></div>
    <div id="tablaIngresos" class="glass-card rounded-3xl shadow-xl shadow-purple-900/5 overflow-hidden border border-purple-100"></div>
  `;

  async function cargar() {
    let query = sb.from('income_records')
      .select('id, amount, client_name, payment_method, record_date, profiles(full_name), services(name)')
      .order('record_date', { ascending: false });
    const emp = document.getElementById('filtroEmpleado').value;
    const desde = document.getElementById('filtroDesde').value;
    const hasta = document.getElementById('filtroHasta').value;
    if (emp) query = query.eq('employee_id', emp);
    if (desde) query = query.gte('record_date', desde);
    if (hasta) query = query.lte('record_date', hasta);

    const { data, error } = await query;
    if (error) { 
      document.getElementById('tablaIngresos').innerHTML = `<p class="text-rose-600 p-5 font-medium">${error.message}</p>`; 
      return; 
    }

    const total = (data || []).reduce((s, r) => s + Number(r.amount), 0);
    const porEmpleado = {};
    (data || []).forEach(r => {
      const nombre = r.profiles?.full_name || '—';
      porEmpleado[nombre] = (porEmpleado[nombre] || 0) + Number(r.amount);
    });

    document.getElementById('resumenTotales').innerHTML = `
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-gradient-to-br from-purple-700 to-indigo-800 text-white rounded-2xl p-4 shadow-lg shadow-purple-700/20 col-span-2 sm:col-span-1">
          <p class="text-xs text-purple-200 font-bold uppercase tracking-wider">Total General</p>
          <p class="text-2xl font-black mt-1">${fmt(total)}</p>
        </div>
        ${Object.entries(porEmpleado).map(([n,t]) => `
          <div class="glass-card rounded-2xl p-4 border border-purple-100">
            <p class="text-xs text-slate-400 font-bold uppercase tracking-wider truncate">${n}</p>
            <p class="text-lg font-black text-purple-700 mt-1">${fmt(t)}</p>
          </div>
        `).join('')}
      </div>`;

    const rows = (data || []).map(r => `
      <tr class="border-b border-purple-100/60 hover:bg-purple-50/30 transition">
        <td data-label="Fecha" class="py-3 px-4 font-semibold text-slate-600">${r.record_date}</td>
        <td data-label="Empleado" class="py-3 px-4 font-bold text-slate-800">${r.profiles?.full_name || '—'}</td>
        <td data-label="Servicio" class="py-3 px-4 font-medium text-slate-700">${r.services?.name || '—'}</td>
        <td data-label="Cliente" class="py-3 px-4 text-slate-500">${r.client_name || '—'}</td>
        <td data-label="Método" class="py-3 px-4">${getPaymentBadge(r.payment_method)}</td>
        <td data-label="Monto" class="py-3 px-4 font-black text-purple-700">${fmt(r.amount)}</td>
        <td data-label="Acciones" class="py-3 px-4 text-right">
          <div class="inline-flex gap-1.5">
            <button data-id="${r.id}" class="editIncAdmin p-1.5 hover:bg-purple-100 text-purple-700 rounded-lg text-xs font-bold transition">✏️</button>
            <button data-id="${r.id}" class="delIncAdmin p-1.5 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-bold transition">🗑️</button>
          </div>
        </td>
      </tr>`).join('');

    document.getElementById('tablaIngresos').innerHTML = `
      <div class="overflow-x-auto">
        <table class="w-full text-sm responsive-table">
          <thead class="bg-gradient-to-r from-purple-50 to-indigo-50/50 text-purple-900 text-left font-bold uppercase text-xs tracking-wider border-b border-purple-100">
            <tr>
              <th class="py-3.5 px-4">Fecha</th>
              <th class="py-3.5 px-4">Empleado</th>
              <th class="py-3.5 px-4">Servicio</th>
              <th class="py-3.5 px-4">Cliente</th>
              <th class="py-3.5 px-4">Pago</th>
              <th class="py-3.5 px-4">Monto</th>
              <th class="py-3.5 px-4 text-right">Acciones</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-purple-100/50">
            ${rows || '<tr><td class="py-6 px-4 text-center text-slate-400 font-medium" colspan="7">No se encontraron registros</td></tr>'}
          </tbody>
        </table>
      </div>`;

    document.querySelectorAll('.editIncAdmin').forEach(btn => {
      btn.onclick = () => openEditIncomeModal(btn.dataset.id, cargar);
    });
    document.querySelectorAll('.delIncAdmin').forEach(btn => {
      btn.onclick = () => {
        showConfirm('Eliminar Ingreso', '¿Estás seguro de que deseas borrar este registro de ingreso?', async () => {
          await sb.from('income_records').delete().eq('id', btn.dataset.id);
          cargar();
        });
      };
    });
  }

  document.getElementById('filtrarBtn').onclick = cargar;
  cargar();
}

  const content = document.getElementById('content');

  content.innerHTML = `
    <div class="glass-card rounded-3xl p-6 md:p-8 max-w-lg mx-auto shadow-xl shadow-purple-900/5 border border-purple-100">
      <h3 class="font-black text-xl mb-6 text-purple-900 flex items-center gap-2.5">
        <span>➕</span> Registrar nuevo ingreso

      <form id="ingresoForm" class="space-y-4">

        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Nombre del cliente (Opcional)</label>
          <input id="clienteInput" placeholder="Ej. Ana Torres" class="input-styled w-full rounded-xl px-4 py-3 text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Método de Pago</label>
          <select id="pagoInput" class="input-styled w-full rounded-xl px-4 py-3 text-sm">
            <option value="efectivo">💵 Efectivo</option>
            <option value="tarjeta">💳 Tarjeta</option>
            <option value="qr">📱 QR / Transferencia</option>
          </select>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Fecha del registro</label>

        </div>

        <button class="w-full btn-gradient text-white font-bold py-3.5 rounded-xl shadow-lg shadow-purple-600/25 text-sm mt-4">
          Guardar Registro
        </button>
      </form>
      <p id="okMsg" class="text-emerald-600 text-sm mt-3 text-center font-bold"></p>
    </div>`;

  document.getElementById('servicioSel').onchange = (e) => {
    const price = e.target.selectedOptions[0]?.dataset.price;
    if (price) document.getElementById('montoInput').value = price;
  };

  document.getElementById('ingresoForm').onsubmit = async (e) => {
    e.preventDefault();
    const payload = {
      employee_id: currentProfile.id,
      service_id: document.getElementById('servicioSel').value,
      amount: parseFloat(document.getElementById('montoInput').value),
      client_name: document.getElementById('clienteInput').value || null,
      payment_method: document.getElementById('pagoInput').value,
      record_date: document.getElementById('fechaInput').value
    };
    const { error } = await sb.from('income_records').insert(payload);
    if (error) {
      openModal(`
        <div class="text-center p-2">
          <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">❌</div>
          <h3 class="text-base font-bold text-slate-800 mb-1">Error al guardar</h3>
          <p class="text-slate-500 text-sm mb-4">${error.message}</p>
          <button onclick="closeModal()" class="btn-gradient text-white px-5 py-2 rounded-xl text-xs font-bold">Cerrar</button>
        </div>
      `);
      return;
    }
    document.getElementById('ingresoForm').reset();
    document.getElementById('fechaInput').value = new Date().toISOString().slice(0,10);
    document.getElementById('okMsg').textContent = '✨ ¡Ingreso registrado con éxito!';
    setTimeout(() => document.getElementById('okMsg').textContent = '', 2500);
  };
}

// ----------------------------------------------------------------
// SESIÓN & INICIALIZACIÓN
// ----------------------------------------------------------------
async function loadSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderAuth();
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (error || !profile) return renderPending();
  currentProfile = profile;
  if (profile.role === 'pendiente' || !profile.active) return renderPending();
  if (profile.role === 'admin') renderUsuarios();
  else renderRegistrarIngreso();
}

sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') renderAuth(); });
loadSession();
</script>
